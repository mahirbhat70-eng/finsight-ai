[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "finsight-backend"
version = "0.1.0"
description = "FinSight AI — deterministic-first investment due diligence & valuation platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "arq>=0.26",
    "redis>=5.2",
    "structlog>=24.4",
    "python-multipart>=0.0.17",
    "pdfplumber>=0.11",
    "rapidfuzz>=3.10",
    "openpyxl>=3.1.5",
    "reportlab>=4.2",
    "python-pptx>=1.0",
    "matplotlib>=3.9",
    "google-generativeai>=0.8",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "prometheus-fastapi-instrumentator>=7.0",
    "slowapi>=0.1.9",
    "passlib[bcrypt]>=1.7",
    "pyjwt>=2.10",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs Postgres + Redis (docker compose up -d)",
    "live: hits a real LLM provider, run manually before demos",
]
