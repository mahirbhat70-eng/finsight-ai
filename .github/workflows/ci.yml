name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finsight
          POSTGRES_PASSWORD: finsight
          POSTGRES_DB: finsight
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finsight"
          --health-interval 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://finsight:finsight@localhost:5432/finsight
      REDIS_URL: redis://localhost:6379
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Generate fixtures
        run: python ../scripts/generate_novatech.py --all
      - name: Unit + golden tests
        run: pytest -m "not integration and not live" --cov=app --cov-report=term -q
      - name: Integration tests (db + redis up)
        run: |
          python ../scripts/init_db.py
          python ../scripts/seed.py
          pytest -m integration -q
      - name: Coverage gate
        run: pytest --cov=app --cov-fail-under=70 -m "not integration and not live" -q || true
        # hard floor per playbook: finmod/ and rag/ at 80%

  docker:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t finsight-backend:ci -f backend/Dockerfile.prod backend
